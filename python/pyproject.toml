[project]
name = "blogslike-agent-service"
version = "0.1.0"
description = "FastAPI + LangChain + LangGraph RAG agent service for BlogsLike."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.4",
    "python-dotenv==1.0.1",
    "langchain>=1.2,<1.3",
    "langgraph>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-community>=0.4,<0.5",
    "qdrant-client==1.12.1",
    "pymysql==1.1.1",
    "redis==5.2.1",
    "sqlparse==0.5.3",
    "requests>=2.32.5,<3.0",
    "beautifulsoup4==4.12.3",
    "rank-bm25==0.2.2",
    "jieba==0.42.1",
    "ragas>=0.2,<0.4",
    "datasets>=2.20,<4.0",
    "pyjwt>=2.8,<3.0",
    "sqlglot>=25.0,<27.0",
]

[project.optional-dependencies]
dev = []

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv]
package = false

[tool.uv.sources]

[tool.ruff]
line-length = 120
target-version = "py311"
