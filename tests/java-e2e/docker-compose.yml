services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: thumb_e2e
      MYSQL_ROOT_PASSWORD: e2e_root
    ports:
      - "13306:3306"
    volumes:
      - ../../src/test/resources/e2e-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pe2e_root"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: e2e
      RABBITMQ_DEFAULT_PASS: e2e
      RABBITMQ_DEFAULT_VHOST: blogslike-e2e
    ports:
      - "25672:5672"
      - "25673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
