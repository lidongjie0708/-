spring:
  application.name: thumb-backend
  mvc:
    servlet:
      path: /api
  profiles:
    active: local
  # DataSource Config
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/thumb_db
    username: root
    password: 123456
  data:
    # Redis 配置
    redis:
      database: 0
      host: ${REDIS_HOST:localhost}
      timeout: 5000
      port: ${REDIS_PORT:6380}
      redission:
        file: classpath:redisson.yaml
  # RabbitMQ 配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 100
# mybatis-plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# knife4j 的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
server:
  port: 9199
# 整合 Prometheus + Grafana
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      percentiles:
        http:
          server:
            requests: 0.5, 0.75, 0.9, 0.95, 0.99

# JWT 配置（密钥从环境变量读取，重启不失效）
jwt:
  secret: oS9M3nPqRfT2xVwYzA7bC4dE5fG6hJ8kL1mN2oP3qR4sT5uV6wX7yZ8=
  expiration: 86400000

# Agent 微服务配置（用于调用 Python Agent 服务）
agent:
  base-url: ${AGENT_BASE_URL:http://localhost:8081}
  connect-timeout: 5000
  read-timeout: 30000
  max-retries: 2
  enabled: ${AGENT_ENABLED:true}
  ai-token-ttl-millis: ${AGENT_AI_TOKEN_TTL_MILLIS:300000}
  internal-token: blogslike-internal-dev-token
